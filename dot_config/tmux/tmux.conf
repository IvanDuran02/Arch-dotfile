# ==============================================================================
# TMUX CONFIGURATION (Catppuccin Mocha / Wayland Optimized)
# ==============================================================================

# Sets default shell to zsh and enables 24-bit TrueColor
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -ga terminal-features ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Passthrough for images (nvim.image / kitty / wezterm protocol)
set -gq allow-passthrough on
set -g visual-activity off

# Disable command history file
set-option -g history-file /dev/null

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload tmux configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Act more like vim to switch between panes
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Act more like vim to copy and select text (Wayland clipboard compatible)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Open new window in current directory
bind-key c new-window -c "#{pane_current_path}"

# tmux-sessionizer keybinding
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Undercurl & cursor shape styling
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colors
set -s set-clipboard on

# ==============================================================================
# PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin theme styling
set -g @catppuccin_flavor 'mocha'

# Initialize TMUX plugin manager (keep this line near the bottom)
run '~/.config/tmux/plugins/tpm/tpm'

# ==============================================================================
# WINDOW STATUS OVERRIDES (Clean pill tabs, no underline)
# ==============================================================================
setw -g window-status-current-style "none"
setw -g window-status-style "none"
setw -g window-status-current-format "#[fg=#fab387,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#1e1e2e,bg=#fab387,bold]#I #[fg=#cdd6f4,bg=#313244,bold] #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=#313244,bg=#1e1e2e,nobold,nounderscore,noitalics]"
setw -g window-status-format "#[fg=#45475a,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#45475a]#I #[fg=#a6adc8,bg=#313244] #W #[fg=#313244,bg=#1e1e2e,nobold,nounderscore,noitalics]"

